# Lembrete no WhatsApp pro convidado que escolheu a casa e não enviou os prints
# (30 min e 24 h depois). Chama /api/cron/lembretes a cada 15 minutos.
#
# Configurar em GitHub → Settings → Secrets and variables → Actions:
#   SITE_URL     ex: https://clubearena.com.br  (sem barra no fim)
#   CRON_SECRET  mesmo valor da variável CRON_SECRET na Vercel
name: Lembretes WhatsApp

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  lembrar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL/CRON_SECRET não configurados, pulando."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/lembretes"
