<!-- @dsCard group="Colors" viewport="700x150" subtitle="Verde limão: superfície no CTA, tom escuro para texto" name="Marca" -->
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{color:var(--text-primary);font-weight:500}
.row{display:grid;gap:12px}
code{font-family:var(--font-mono);font-size:11px}

</style>
<div class="row" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw"><i style="background:var(--brand-500)"></i><b>--brand-500</b><code>#bfe83a · CTA</code></div>
  <div class="sw"><i style="background:var(--brand-600)"></i><b>--brand-600</b><code>#a8d420 · hover</code></div>
  <div class="sw"><i style="background:var(--brand-700)"></i><b>--brand-700</b><code>#4d7c0f · texto, ✓, ★</code></div>
  <div class="sw"><i style="background:var(--brand-100)"></i><b>--brand-100</b><code>#eff9d0 · selo suave</code></div>
</div>
