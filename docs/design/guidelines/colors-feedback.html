<!-- @dsCard group="Colors" viewport="700x150" subtitle="Provisório — status de payout no admin (pago / recusado)" name="Feedback" -->
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{color:var(--text-primary);font-weight:500}
.row{display:grid;gap:12px}
code{font-family:var(--font-mono);font-size:11px}

</style>
<div class="row" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw"><i style="background:var(--success-600)"></i><b>--success-600</b><code>pago · válida</code></div>
  <div class="sw"><i style="background:var(--success-100)"></i><b>--success-100</b></div>
  <div class="sw"><i style="background:var(--danger-600)"></i><b>--danger-600</b><code>recusado · inválida</code></div>
  <div class="sw"><i style="background:var(--danger-100)"></i><b>--danger-100</b></div>
</div>
