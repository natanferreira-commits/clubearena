<!-- @dsCard group="Colors" viewport="700x170" subtitle="Neutros quentes — 90% da interface" name="Neutros" -->
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{color:var(--text-primary);font-weight:500}
.row{display:grid;gap:12px}
code{font-family:var(--font-mono);font-size:11px}

</style>
<div class="row" style="grid-template-columns:repeat(5,1fr)">
  <div class="sw"><i style="background:var(--ink-900)"></i><b>--ink-900</b><code>texto</code></div>
  <div class="sw"><i style="background:var(--ink-700)"></i><b>--ink-700</b><code>secundário</code></div>
  <div class="sw"><i style="background:var(--ink-500)"></i><b>--ink-500</b><code>discreto</code></div>
  <div class="sw"><i style="background:var(--ink-300)"></i><b>--ink-300</b><code>placeholder</code></div>
  <div class="sw"><i style="background:var(--line-200)"></i><b>--line-200</b><code>borda</code></div>
  <div class="sw"><i style="background:var(--line-100)"></i><b>--line-100</b><code>hairline</code></div>
  <div class="sw"><i style="background:var(--paper-50)"></i><b>--paper-50</b><code>bloco</code></div>
  <div class="sw"><i style="background:var(--paper-0)"></i><b>--paper-0</b><code>página</code></div>
  <div class="sw"><i style="background:var(--canvas)"></i><b>--canvas</b><code>fora da tela</code></div>
</div>
