<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{color:var(--text-primary);font-weight:500}
.row{display:grid;gap:12px}
code{font-family:var(--font-mono);font-size:11px}

</style>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  <div style="display:flex;align-items:center;justify-content:center;width:240px;height:var(--control-h-button);border-radius:var(--radius-pill);background:var(--button-primary-bg);color:var(--button-primary-fg);font-weight:600;font-size:16px;box-shadow:var(--shadow-cta)">Aceitar convite</div>
  <div style="display:flex;align-items:center;justify-content:center;width:240px;height:var(--control-h-button);border-radius:var(--radius-pill);background:var(--button-secondary-bg);color:var(--button-secondary-fg);font-weight:500;font-size:16px">Ver regras do clube</div>
  <a style="font-size:14px;color:var(--text-link);text-decoration:underline">Regras</a>
</div>
<div style="margin-top:12px;font-size:12px;color:var(--text-muted)">Um primário por tela. Nunca dois verdes lado a lado.</div>
