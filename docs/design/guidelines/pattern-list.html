<!-- @dsCard group="Patterns" viewport="700x200" subtitle="Linhas com hairline — passos numerados, benefícios com ✓, tabela de níveis" name="Listas" -->
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{color:var(--text-primary);font-weight:500}
.row{display:grid;gap:12px}
code{font-family:var(--font-mono);font-size:11px}

</style>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;font-size:14px">
  <div>
    <div style="display:grid;grid-template-columns:28px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--text-muted);font-weight:500">01</span><div><div style="font-weight:500;font-size:15px">Crie seu convite</div><div style="color:var(--text-muted)">Informe seu WhatsApp e um apelido.</div></div></div>
    <div style="display:grid;grid-template-columns:20px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-hairline)"><span style="color:var(--accent-text);font-weight:600">✓</span><div style="font-weight:500;font-size:15px">Entrada grátis no bolão da semana</div></div>
  </div>
  <div>
    <div style="display:grid;grid-template-columns:1fr 40px 1.4fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-strong);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)"><div>Nível</div><div style="text-align:right;color:var(--accent-text)">★</div><div>Recompensa</div></div>
    <div style="display:grid;grid-template-columns:1fr 40px 1.4fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-hairline)"><div style="font-weight:500">Prata</div><div style="text-align:right">3</div><div style="color:var(--text-secondary)">Entrada bônus no bolão</div></div>
    <div style="display:grid;grid-template-columns:1fr 40px 1.4fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-hairline)"><div style="font-weight:500">Diamante</div><div style="text-align:right">10</div><div style="color:var(--text-secondary)">Prêmio do clube: R$ 500</div></div>
  </div>
</div>
