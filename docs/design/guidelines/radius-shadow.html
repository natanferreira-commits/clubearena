<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Raios por papel · uma única sombra, só no CTA" name="Raio e sombra" -->
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{color:var(--text-primary);font-weight:500}
.row{display:grid;gap:12px}
code{font-family:var(--font-mono);font-size:11px}

</style>
<div style="display:flex;gap:16px;align-items:flex-end;font-size:11px;color:var(--text-muted)">
  <div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--surface-subtle)"></div><code>sm</code> badge</div><div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--border-default);border-radius:var(--radius-md);background:var(--surface-subtle)"></div><code>md</code> input</div><div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--surface-subtle)"></div><code>lg</code> ranking</div><div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--border-default);border-radius:var(--radius-xl);background:var(--surface-subtle)"></div><code>xl</code> bloco</div><div style="text-align:center"><div style="width:64px;height:64px;border:1px solid var(--border-default);border-radius:var(--radius-2xl);background:var(--surface-subtle)"></div><code>2xl</code> tela</div>
  <div style="text-align:center"><div style="width:120px;height:44px;border-radius:var(--radius-pill);background:var(--accent);box-shadow:var(--shadow-cta)"></div><code>pill</code> + <code>--shadow-cta</code></div>
</div>
