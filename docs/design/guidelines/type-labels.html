<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-primary);background:var(--surface-page);-webkit-font-smoothing:antialiased}
.sw{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
.sw i{display:block;height:56px;border-radius:var(--radius-md);border:1px solid var(--border-hairline)}
.sw b{color:var(--text-primary);font-weight:500}
.row{display:grid;gap:12px}
code{font-family:var(--font-mono);font-size:11px}

</style>
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:center">
  <div style="font-size:var(--text-eyebrow-size);letter-spacing:var(--text-eyebrow-ls);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--text-muted)">Eyebrow discreto</div>
  <div style="display:inline-block;font-size:var(--text-eyebrow-size);letter-spacing:var(--text-eyebrow-ls);text-transform:uppercase;font-weight:var(--weight-semibold);color:var(--text-primary);background:var(--accent-soft);padding:5px 10px;border-radius:var(--radius-pill)">Para membros da Arena</div>
  <div style="font-size:var(--text-wordmark-size);font-weight:var(--weight-semibold);letter-spacing:-.01em">Clube Arena<span style="color:var(--accent-text)">.</span></div>
  <div style="font-family:var(--font-mono);font-size:14px">clubearena.com.br/c/<span style="color:var(--accent-text)">JOAO7X</span></div>
  <div style="border:1px solid var(--ink-500);border-radius:var(--radius-sm);padding:2px 6px;font-weight:600;font-size:12px;color:var(--text-muted)">18+</div>
</div>
